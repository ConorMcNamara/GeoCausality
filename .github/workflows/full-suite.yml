name: Full test suite

# CI skips tests marked slow on every OS/Python cell except the one that uploads
# coverage. This weekly run covers the slow parity fits on every cell, so a
# platform- or version-specific regression surfaces within a week.
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  python-versions:
    name: Derive supported Python versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same source of truth as ci.yml: the trove classifiers in pyproject.toml.
      - name: Inspect package for supported Python versions
        id: baipp
        uses: hynek/build-and-inspect-python-package@v2

  test:
    name: Full suite Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: python-versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}

    # pytest-xdist runs one process per core; pin BLAS/OpenMP to a single thread so
    # the workers don't oversubscribe the runner, and keep matplotlib headless.
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: uv sync --extra dev

      - name: Run full test suite
        run: uv run pytest -n auto --dist loadscope
