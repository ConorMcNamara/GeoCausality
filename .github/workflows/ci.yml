name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Classifies the diff so doc-only changes (docs/, top-level *.md) skip the
  # lint/test/build jobs, while code-only changes still rebuild the docs
  # (autodoc imports the package). Skipped jobs report as successful.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - 'GeoCausality/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            code:
              - *shared
              - 'test/**'
              - 'Makefile'
            docs:
              - *shared
              - 'docs/**'

  lint:
    name: Lint and Format Check
    needs: [changes, python-versions]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ needs.python-versions.outputs.min-version }}

      # ruff and zuban are standalone tools, not project dependencies, so run
      # them with uvx (no need to sync the whole environment). Type checking
      # tolerates missing imports (see [tool.zuban] in pyproject.toml).
      - name: Run ruff format check
        run: uvx ruff format --check .

      - name: Run ruff linting
        run: uvx ruff check .

      - name: Run zuban type checking
        run: uvx zuban check GeoCausality

  python-versions:
    name: Derive supported Python versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
      min-version: ${{ steps.min.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Reads the "Programming Language :: Python :: X.Y" trove classifiers from
      # pyproject.toml and emits them as a JSON array, so the test matrix stays in
      # sync with the single source of truth. Update the classifiers to add/drop a version.
      - name: Inspect package for supported Python versions
        id: baipp
        uses: hynek/build-and-inspect-python-package@v2

      # Lowest supported version (version-aware sort so 3.9 < 3.10), used to pin
      # a single coverage upload without hardcoding a version number.
      - name: Determine lowest supported Python version
        id: min
        run: |
          version=$(echo '${{ steps.baipp.outputs.supported_python_classifiers_json_array }}' \
            | jq -r '.[]' | sort -V | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: [changes, python-versions]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}

    # pytest-xdist runs one process per core; pin BLAS/OpenMP to a single thread so
    # the workers don't oversubscribe the runner, and keep matplotlib headless.
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Harmless for stable releases; lets the newest classifier build before its final release.
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: uv sync --extra dev

      # The full suite (including tests marked slow) runs once, on the cell that
      # uploads coverage; every other OS/Python cell skips the slow parity fits.
      # --dist loadscope keeps each class/module on one worker so its scoped
      # fixtures (the expensive parity fits) are built once, not once per worker.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == needs.python-versions.outputs.min-version
        run: uv run pytest -n auto --dist loadscope --cov=GeoCausality --cov-report=xml --cov-report=term-missing

      - name: Run tests (excluding slow)
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != needs.python-versions.outputs.min-version
        run: uv run pytest -n auto --dist loadscope -m "not slow"

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == needs.python-versions.outputs.min-version
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  docs:
    name: Build docs
    needs: [changes, python-versions]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ needs.python-versions.outputs.min-version }}

      - name: Install package and docs dependencies
        run: |
          uv sync
          uv pip install -r docs/requirements.txt

      - name: Build docs (warnings as errors)
        run: uv run sphinx-build -b html -W --keep-going docs docs/_build/html

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [changes, lint, test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
